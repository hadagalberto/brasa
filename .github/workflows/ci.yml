name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: format, lint, check, build, e2e, Lighthouse
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Test (Playwright + axe)
        run: npm run test
        env:
          CI: 'true'

      - name: Lighthouse CI (mobile preset)
        run: npx @lhci/cli autorun

      - name: Lighthouse CI (desktop preset)
        run: npx @lhci/cli autorun --collect.settings.preset=desktop

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            .lighthouseci/
          retention-days: 7
