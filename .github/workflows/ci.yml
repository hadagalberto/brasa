name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: format, lint, check, build, e2e, axe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      # --with-deps shells out to apt-get and only exists on Linux runners.
      - name: Install Playwright browsers (Linux system deps)
        if: runner.os == 'Linux'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright browsers (macOS / Windows)
        if: runner.os != 'Linux'
        run: npx playwright install chromium

      - name: Test (Playwright + axe)
        run: npm run test
        env:
          CI: 'true'

      # Lighthouse is an audit, not a portability gate: run it once on Linux
      # with the same wrapper used locally so CI and developers agree.
      - name: Lighthouse CI (mobile preset)
        if: runner.os == 'Linux'
        run: npm run lhci:mobile

      - name: Lighthouse CI (desktop preset)
        if: runner.os == 'Linux'
        run: npm run lhci:desktop

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            .lighthouseci/
          retention-days: 7
