# Deploys the built site to GitHub Pages.
#
# The base path is configurable: it defaults to "/brasa" (a project page at
# https://<user>.github.io/brasa). If you use a custom domain — or a
# <user>.github.io repository — set BASE_PATH to "/" instead.

name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      base_path:
        description: 'Base path for the build ("/" or "/<repo-name>")'
        default: '/brasa'
        required: false
  push:
    branches: [main]

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  BASE_PATH: ${{ github.event_name == 'workflow_dispatch' && inputs.base_path || '/brasa' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PAGES_BASE_PATH: ${{ env.BASE_PATH }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
